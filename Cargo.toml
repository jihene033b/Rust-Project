[workspace]
resolver = "3"
members = [
    "crates/network_scanner",
    "crates/http_fuzzer",
    "crates/cve_scanner",
    "crates/main_orchestrator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Equipe-2"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }